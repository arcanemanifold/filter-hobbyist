<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filter Hobbyist</title>
</head>
<body>
<div id="app"></div>
<script>window.FH = {};</script>
<script data-module="units">
(function () {
  // Standard preferred-value mantissas (1.0 to 9.x), one decade.
  const SERIES = {
    E6: [1.0, 1.5, 2.2, 3.3, 4.7, 6.8],
    E12: [1.0, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3, 3.9, 4.7, 5.6, 6.8, 8.2],
    E24: [1.0, 1.1, 1.2, 1.3, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.3, 3.6, 3.9, 4.3, 4.7, 5.1, 5.6, 6.2, 6.8, 7.5, 8.2, 9.1],
    E96: [1.00, 1.02, 1.05, 1.07, 1.10, 1.13, 1.15, 1.18, 1.21, 1.24, 1.27, 1.30, 1.33, 1.37, 1.40, 1.43,
      1.47, 1.50, 1.54, 1.58, 1.62, 1.65, 1.69, 1.74, 1.78, 1.82, 1.87, 1.91, 1.96, 2.00, 2.05, 2.10,
      2.15, 2.21, 2.26, 2.32, 2.37, 2.43, 2.49, 2.55, 2.61, 2.67, 2.74, 2.80, 2.87, 2.94, 3.01, 3.09,
      3.16, 3.24, 3.32, 3.40, 3.48, 3.57, 3.65, 3.74, 3.83, 3.92, 4.02, 4.12, 4.22, 4.32, 4.42, 4.53,
      4.64, 4.75, 4.87, 4.99, 5.11, 5.23, 5.36, 5.49, 5.62, 5.76, 5.90, 6.04, 6.19, 6.34, 6.49, 6.65,
      6.81, 6.98, 7.15, 7.32, 7.50, 7.68, 7.87, 8.06, 8.25, 8.45, 8.66, 8.87, 9.09, 9.31, 9.53, 9.76],
  };

  // Prefix letters -> power of ten. 'm' (milli) and 'M' (mega) are case-sensitive;
  // the rest are case-insensitive (handled by lower-casing everything but m/M).
  const PREFIX = { p: -12, n: -9, u: -6, 'µ': -6, 'μ': -6, m: -3, k: 3, M: 6, G: 9 };

  // "4.7n", "4n7", "4700p", "10K", "1.5M", "20000" -> number.
  // Blank -> null. Invalid or <= 0 -> NaN. Trailing F / Hz / ohm / Ω is ignored.
  function parseEng(text) {
    let s = String(text).trim();
    if (s === '') return null;
    s = s.replace(/\s*(hz|ohms?|Ω|f)$/i, '').trim();
    // digits [. digits] [prefix] [digits]   (4.7n, 4n7, 20000; not both a point and a tail)
    const m = /^(\d+)(?:\.(\d+))?\s*([pnuµμmkKMG])?(\d+)?$/.exec(s);
    if (!m) return NaN;
    const [, whole, frac, prefix, tail] = m;
    if (tail !== undefined && (frac !== undefined || !prefix)) return NaN;
    let exp = 0;
    if (prefix) exp = PREFIX[prefix === 'K' ? 'k' : (prefix === 'm' || prefix === 'M' ? prefix : prefix.toLowerCase())];
    const mantissa = whole + '.' + (frac !== undefined ? frac : tail !== undefined ? tail : '0');
    const v = Number(mantissa + 'e' + exp);
    return v > 0 ? v : NaN;
  }

  const SUFFIX = { '-12': 'p', '-9': 'n', '-6': 'u', '-3': 'm', 0: '', 3: 'k', 6: 'M', 9: 'G' };

  // 4.7e-9 -> "4.70n" (sig significant figures, engineering prefix).
  function formatEng(x, sig = 3) {
    if (!(x > 0)) return String(x);
    let group = Math.floor(Math.log10(x) / 3) * 3;
    group = Math.max(-12, Math.min(9, group));
    let mant = x / Math.pow(10, group);
    if (mant < 1 && group > -12) { group -= 3; mant = x / Math.pow(10, group); } // log10 edge
    let text = mant.toPrecision(sig);
    if (Number(text) >= 1000 && group < 9) { // e.g. 999.6 -> 1.00k
      group += 3;
      text = (x / Math.pow(10, group)).toPrecision(sig);
    }
    // toPrecision may switch to exponent form for huge mantissas; keep it plain.
    if (/e/.test(text)) text = String(Number(text));
    return text + SUFFIX[group];
  }

  // All values of a series in decades e-1 .. e+1 around x, ascending.
  // Built via string -> Number so 1.5e-8 is exact, not 1.5 * 1e-8.
  function candidates(x, series) {
    const e = Math.floor(Math.log10(x));
    const out = [];
    for (let d = e - 1; d <= e + 1; d++) {
      for (const m of SERIES[series]) out.push(Number(m + 'e' + d));
    }
    return out;
  }

  // Nearest series value on a log scale: argmin |ln(x / v)|.
  function roundToSeries(x, series) {
    if (series === 'Exact' || !SERIES[series] || !(x > 0)) return x;
    let best = null, bestErr = Infinity;
    for (const v of candidates(x, series)) {
      const err = Math.abs(Math.log(x / v));
      if (err < bestErr) { best = v; bestErr = err; }
    }
    return best;
  }

  // Next series value above (dir = 1) or below (dir = -1) x.
  function stepSeries(x, series, dir) {
    if (series === 'Exact' || !SERIES[series] || !(x > 0)) return x;
    const tol = 1e-9; // x is usually already on the series; skip itself
    const list = candidates(x, series);
    if (dir > 0) return list.find(v => v > x * (1 + tol));
    return list.filter(v => v < x * (1 - tol)).pop();
  }

  window.FH.units = { SERIES, parseEng, formatEng, roundToSeries, stepSeries };
})();
</script>
<script data-module="poles">
(function () {
  // Chebyshev edge: 'ripple-edge' puts w=1 at the ripple band edge (TI style);
  // flip to '3dB' to normalize to the -3 dB point instead (spec check 1).
  const CHEBY_NORM = 'ripple-edge';

  // Turn a list of left-half-plane poles (upper-half only, plus any real ones)
  // into stages: real pole first, then pairs sorted by ascending Q.
  // pole {re, im}: wn = |p|, Q = wn / (2 |re|).
  function toStages(poles) {
    const reals = [], pairs = [];
    for (const p of poles) {
      const wn = Math.hypot(p.re, p.im);
      if (Math.abs(p.im) < 1e-9 * wn) reals.push({ kind: 'real', wn });
      else pairs.push({ kind: 'pair', wn, q: wn / (2 * Math.abs(p.re)) });
    }
    pairs.sort((a, b) => a.q - b.q);
    return reals.concat(pairs);
  }

  // Butterworth: poles on the unit circle, at angle theta_k from the jw axis.
  function butterworth(n) {
    const poles = [];
    for (let k = 1; k <= Math.floor(n / 2); k++) {
      const th = (2 * k - 1) * Math.PI / (2 * n);
      poles.push({ re: -Math.sin(th), im: Math.cos(th) });
    }
    if (n % 2) poles.push({ re: -1, im: 0 });
    return toStages(poles);
  }

  // Chebyshev type I: Butterworth-like poles squeezed onto an ellipse.
  // eps sets the ripple; a = asinh(1/eps)/n. Edge of ripple band at w = 1.
  function chebyshev(n, rippleDb) {
    const eps = Math.sqrt(Math.pow(10, rippleDb / 10) - 1);
    const a = Math.asinh(1 / eps) / n;
    const poles = [];
    for (let k = 1; k <= Math.floor(n / 2); k++) {
      const th = (2 * k - 1) * Math.PI / (2 * n);
      poles.push({ re: -Math.sinh(a) * Math.sin(th), im: Math.cosh(a) * Math.cos(th) });
    }
    if (n % 2) poles.push({ re: -Math.sinh(a), im: 0 });
    if (CHEBY_NORM === '3dB') {
      // Scale so |H(j1)| = -3 dB: cutoff = cosh(acosh(1/eps)/n).
      const f = Math.cosh(Math.acosh(1 / eps) / n);
      for (const p of poles) { p.re /= f; p.im /= f; }
    }
    return toStages(poles);
  }

  // --- Bessel -------------------------------------------------------------
  // Reverse Bessel polynomial: theta_n(s) = sum a_k s^k,
  // a_k = (2n-k)! / (2^(n-k) k! (n-k)!). Its roots are the Bessel poles
  // (unit group delay at DC); we then rescale so the -3 dB point is w = 1.
  function factorial(m) { let f = 1; for (let i = 2; i <= m; i++) f *= i; return f; }

  function besselCoeffs(n) {
    const a = [];
    for (let k = 0; k <= n; k++) {
      a.push(factorial(2 * n - k) / (Math.pow(2, n - k) * factorial(k) * factorial(n - k)));
    }
    return a; // a[k] multiplies s^k; a[n] is the leading coefficient
  }

  // Complex helpers on [re, im] pairs.
  const cmul = (x, y) => [x[0] * y[0] - x[1] * y[1], x[0] * y[1] + x[1] * y[0]];
  const csub = (x, y) => [x[0] - y[0], x[1] - y[1]];
  function cdiv(x, y) {
    const d = y[0] * y[0] + y[1] * y[1];
    return [(x[0] * y[0] + x[1] * y[1]) / d, (x[1] * y[0] - x[0] * y[1]) / d];
  }

  // Durand-Kerner: refine all n roots at once; each root is moved by
  // p(z_i) / prod_{j != i}(z_i - z_j). Start on a spiral of distinct points.
  function polyRoots(coeffs) {
    const n = coeffs.length - 1;
    const c = coeffs.map(v => v / coeffs[n]); // monic
    const z = [];
    for (let i = 0; i < n; i++) {
      const ang = 2 * Math.PI * i / n + 0.4;
      z.push([Math.cos(ang) * (1 + 0.3 * i), Math.sin(ang) * (1 + 0.3 * i)]);
    }
    for (let iter = 0; iter < 500; iter++) {
      let maxStep = 0;
      for (let i = 0; i < n; i++) {
        let p = [1, 0]; // Horner, highest power first
        for (let k = n - 1; k >= 0; k--) p = cmul(p, z[i]), p[0] += c[k];
        let den = [1, 0];
        for (let j = 0; j < n; j++) if (j !== i) den = cmul(den, csub(z[i], z[j]));
        const step = cdiv(p, den);
        z[i] = csub(z[i], step);
        maxStep = Math.max(maxStep, Math.hypot(step[0], step[1]));
      }
      if (maxStep < 1e-14) break;
    }
    return z;
  }

  function bessel(n) {
    const a = besselCoeffs(n);
    const roots = polyRoots(a);
    // |H(jw)| = a0 / |theta_n(jw)|. Find w3 where it equals 1/sqrt(2).
    const mag = w => {
      let re = 0, im = 0; // sum a_k (jw)^k
      for (let k = 0; k <= n; k++) {
        const r = a[k] * Math.pow(w, k);
        const ph = k % 4;
        if (ph === 0) re += r; else if (ph === 1) im += r;
        else if (ph === 2) re -= r; else im -= r;
      }
      return a[0] / Math.hypot(re, im);
    };
    let lo = 0, hi = 1;
    while (mag(hi) > Math.SQRT1_2) hi *= 2;
    for (let i = 0; i < 100; i++) {
      const mid = (lo + hi) / 2;
      if (mag(mid) > Math.SQRT1_2) lo = mid; else hi = mid;
    }
    const w3 = (lo + hi) / 2;
    // Keep upper-half-plane poles plus the real one, scaled by 1/w3.
    const poles = roots
      .filter(r => r[1] > 1e-9 || Math.abs(r[1]) <= 1e-9)
      .map(r => ({ re: r[0] / w3, im: Math.abs(r[1]) < 1e-9 ? 0 : r[1] / w3 }));
    return toStages(poles);
  }

  function prototype(response, order, rippleDb) {
    if (response === 'butterworth') return butterworth(order);
    if (response === 'chebyshev') return chebyshev(order, rippleDb);
    if (response === 'bessel') return bessel(order);
    throw new Error('Unknown response: ' + response);
  }

  window.FH.poles = { prototype, CHEBY_NORM };
})();
</script>
<script data-module="stages">
(function () {
  const PAIR_LABELS = ['A', 'B', 'C', 'D', 'E'];

  // Build the list of stage targets (label, role, kind, fn, q, gain) for a state.
  // Reads: passband, response, poles, fc, rippleDb, bpQ, entries.
  function build(s) {
    const entries = s.entries || {};
    // A typed gain wins; otherwise the default.
    const gainFor = (label, dflt) => {
      const e = entries[label];
      return e && typeof e.gain === 'number' ? e.gain : dflt;
    };
    const stages = [];

    if (s.passband === 'bp' || s.passband === 'notch') {
      const count = s.passband === 'notch' ? 1 : Math.min(s.poles, PAIR_LABELS.length);
      for (let i = 0; i < count; i++) {
        const label = PAIR_LABELS[i];
        const dflt = s.passband === 'bp' ? s.bpQ : 1;
        stages.push({ label, role: s.passband, kind: 'pair', fn: s.fc, q: s.bpQ, gain: gainFor(label, dflt) });
      }
      return stages;
    }

    // LP / HP: real pole first (if any), then pairs A, B, ... in prototype order.
    let pairIndex = 0;
    for (const p of window.FH.poles.prototype(s.response, s.poles, s.rippleDb)) {
      const fn = s.passband === 'hp' ? s.fc / p.wn : s.fc * p.wn;
      if (p.kind === 'real') {
        stages.push({ label: 'Real', role: s.passband, kind: 'real', fn, q: null, gain: 1 });
      } else {
        const label = PAIR_LABELS[pairIndex++];
        stages.push({ label, role: s.passband, kind: 'pair', fn, q: p.q, gain: gainFor(label, 1) });
      }
    }
    return stages;
  }

  window.FH.stages = { build };
})();
</script>
<script data-module="solve">
(function () {
  const { formatEng, roundToSeries, stepSeries } = window.FH.units;
  const MAX_CAP = 1e-6;
  const CAP_LIMIT_MSG = 'Capacitors are not supported above 1uF.';

  // Solve one stage's parts.
  //   stage:   { label, role, kind: 'real'|'pair', fn, q, gain } from FH.stages
  //   circuit: 'mfb' | 'sk'   (band-pass: MFB only; notch: ignored)
  //   entry:   user caps { c1?, c2?, c3? } (farads), kept exactly as typed
  //   opts:    { resSeries, capSeries, seed }  seed = R1 Seed in ohms
  // Returns { stage, circuit, parts, gainActual, error }. On a refusal parts is
  // null and error says why. Part values are rounded to their series
  // ("Exact" leaves them unrounded).
  function stage(st, circuit, entry, opts) {
    entry = entry || {};
    const ctx = {
      st, entry, seed: opts.seed,
      w0: 2 * Math.PI * st.fn,
      // Base cap: the C that would pair with R = seed at fn.
      c0: 1 / (2 * Math.PI * st.fn * opts.seed),
      roundR: x => roundToSeries(x, opts.resSeries),
      roundC: x => roundToSeries(x, opts.capSeries),
      capSeries: opts.capSeries,
    };
    const fail = error => ({ stage: st, circuit, parts: null, gainActual: null, error });

    for (const k of ['c1', 'c2', 'c3']) {
      if (entry[k] != null && entry[k] > MAX_CAP) return fail(CAP_LIMIT_MSG);
    }

    let out;
    const hp = st.role === 'hp';
    if (st.role === 'notch') out = solveNotch(ctx);        // one fixed topology
    else if (st.role === 'bp') {
      if (circuit !== 'mfb') return fail('Band-pass is MFB only.');
      out = solveMfbBandPass(ctx);
    }
    else if (st.kind === 'real') out = solveRealPole(ctx); // same R, C for LP and HP
    else if (circuit === 'mfb') out = hp ? solveMfbHighPass(ctx) : solveMfbLowPass(ctx);
    else if (circuit === 'sk') out = hp ? solveSkHighPass(ctx) : solveSkLowPass(ctx);
    else return fail(`Unknown circuit: ${circuit}`);

    if (out.error) return fail(out.error);
    // A cap computed from an entered one can still land above the limit.
    for (const [name, v] of Object.entries(out.parts)) {
      if (name[0] === 'C' && v > MAX_CAP) return fail(CAP_LIMIT_MSG);
    }
    return { stage: st, circuit, parts: out.parts, gainActual: out.gainActual, error: null };
  }

  // ---- Real pole: one RC, then a unity buffer ----------------------------------
  //   low-pass:  R1 in series, C1 to ground
  //   high-pass: C1 in series, R1 to ground
  // Either way fn = 1/(2π·R·C). Pick C (entered, or C0 rounded, capped at 1uF),
  // then solve R from it.
  function solveRealPole(ctx) {
    const C = ctx.entry.c1 != null ? ctx.entry.c1 : ctx.roundC(Math.min(ctx.c0, MAX_CAP));
    const R = ctx.roundR(1 / (ctx.w0 * C));
    return { parts: { R1: R, C1: C }, gainActual: 1 };
  }

  // ---- Default cap pair ------------------------------------------------------
  // Both topologies need one cap bigger than the other by at least minRatio
  // (otherwise the resistor quadratic has no real root). Default: aim for
  // 1.5x that minimum, centred (geometrically) on C0, round both, then widen
  // the gap one series step at a time until there is at least 1.2x margin
  // left after rounding.
  //   enteredBig / enteredSmall: a user-entered cap in that position, if any.
  //   The entered cap is never changed; only the other one is chosen.
  // Returns { big, small }.
  function defaultCapPair(ctx, minRatio, enteredBig, enteredSmall) {
    const r = 1.5 * minRatio;
    const target = 1.2 * minRatio;
    const step = (x, dir) => stepSeries(x, ctx.capSeries, dir);
    let big, small;
    if (enteredBig != null) {
      big = enteredBig;
      small = ctx.roundC(big / r);
      while (big / small < target) {
        const next = step(small, -1);
        if (!(next < small)) break; // "Exact" series: nothing to step
        small = next;
      }
    } else if (enteredSmall != null) {
      small = enteredSmall;
      big = ctx.roundC(small * r);
      while (big / small < target) {
        const next = step(big, +1);
        if (!(next > big)) break;
        big = next;
      }
    } else {
      // Keep the big cap at or under 1uF: at very low fn, C0 alone exceeds it,
      // so slide the centre down (the resistors scale up to compensate).
      const centre = Math.min(ctx.c0, MAX_CAP / Math.sqrt(r));
      big = ctx.roundC(centre * Math.sqrt(r));
      small = ctx.roundC(centre / Math.sqrt(r));
      while (big / small < target) {
        // Normally step the big cap up; if that would pass 1uF, step the small one down.
        const up = step(big, +1);
        if (up > big && up <= MAX_CAP) { big = up; continue; }
        const down = step(small, -1);
        if (!(down < small)) break;
        small = down;
      }
    }
    return { big, small };
  }

  // ---- MFB low-pass ------------------------------------------------------------
  // R1 from the input to node X, C2 from X to ground, R2 from X to the output
  // (gain-setting feedback), R3 from X to the inverting input, C1 from the
  // output to the inverting input. Gain G = R2/R1 (inverting).
  //   ω0²      = 1/(R2·R3·C1·C2)
  //   1/(Q·ω0) = C1·(R2 + R3 + R2·R3/R1) = C1·(R2 + (1+G)·R3)
  // Substituting R3 = 1/(ω0²·R2·C1·C2) and multiplying by R2/C1 gives one
  // quadratic in R2:
  //     R2² − R2/(Q·ω0·C1) + (1+G)/(ω0²·C1·C2) = 0
  // Real roots need the discriminant ≥ 0:  C2/C1 ≥ 4·Q²·(1+G).
  function solveMfbLowPass(ctx) {
    const { st, entry, w0 } = ctx;
    const Q = st.q, G = st.gain;
    const minRatio = 4 * Q * Q * (1 + G);

    let C1, C2;
    if (entry.c1 != null && entry.c2 != null) {
      C1 = entry.c1; C2 = entry.c2;
    } else {
      // C2 is the big cap, C1 the small one.
      const pair = defaultCapPair(ctx, minRatio, entry.c2, entry.c1);
      C1 = pair.small; C2 = pair.big;
    }
    // Tiny tolerance so a ratio exactly at the bound isn't refused by float noise.
    if (C2 / C1 < minRatio * (1 - 1e-12)) {
      return { error: `C2 must be ≥ ${formatEng(minRatio * C1)} for Q = ${Q.toFixed(2)} at gain ${G}` };
    }

    // Quadratic x² + p·x + q = 0 with p = −1/(Q·ω0·C1), q = (1+G)/(ω0²·C1·C2).
    // FilterPro takes the smaller root (it gives the lower-impedance R2).
    const half = 1 / (2 * Q * w0 * C1);                  // −p/2
    const qTerm = (1 + G) / (w0 * w0 * C1 * C2);
    const disc = Math.max(0, half * half - qTerm);         // ≥ 0 by the check above
    const R2 = ctx.roundR(half - Math.sqrt(disc));
    const R1 = ctx.roundR(R2 / G);
    // R3 sets fn: recompute it from the *rounded* R2, as FilterPro does.
    const R3 = ctx.roundR(1 / (w0 * w0 * R2 * C1 * C2));
    return { parts: { R1, R2, R3, C1, C2 }, gainActual: R2 / R1 };
  }

  // Smallest Cf/Cg that gives a real, positive R1 for Sallen-Key at gain K.
  // From the discriminant of the R1 quadratic below (with m = Cf/Cg):
  //   1/Q² ≥ 4·(1/m + 1 − K)   →   m ≥ 1 / (1/(4Q²) + K − 1)
  // K = 1 gives the familiar Cf/Cg ≥ 4Q². Higher K relaxes it quickly.
  // Returns Infinity when no ratio works (K below 1 with high Q).
  function skMinRatio(Q, K) {
    const d = 1 / (4 * Q * Q) + K - 1;
    return d > 0 ? 1 / d : Infinity;
  }

  // ---- Sallen-Key low-pass --------------------------------------------------
  // R1 from the input to node X, R2 from X to the + input, C2 (Cg) from the
  // + input to ground, C1 (Cf) from X to the output. Non-inverting gain
  // K = 1 + R4/R3, with R3 (to ground) = the seed.
  //   a = R1·R2·Cf·Cg               = 1/ω0²
  //   b = Cg·(R1+R2) + R1·Cf·(1−K)  = 1/(Q·ω0)
  // Substituting R2 = a/(R1·Cf·Cg) into b gives a quadratic in R1:
  //   (Cg + Cf·(1−K))·R1² − b·R1 + a/Cf = 0
  // Uses the gain as typed (K), not the gain the rounded R3/R4 give.
  function solveSkLowPass(ctx) {
    const { st, entry, w0 } = ctx;
    const Q = st.q, K = st.gain;
    // K = 1 + R4/R3 can't go below 1 with this circuit. (Some K < 1 would still
    // give a real R1, but there is no R3/R4 that builds it, so refuse them all.)
    if (!(K >= 1)) {
      return { error: `Sallen-Key gain must be ≥ 1 (got ${K})` };
    }
    const minRatio = skMinRatio(Q, K); // finite for any K ≥ 1

    let Cf, Cg;
    if (entry.c1 != null && entry.c2 != null) {
      Cf = entry.c1; Cg = entry.c2;
    } else {
      // Cf (C1) is the big cap, Cg (C2) the small one.
      const pair = defaultCapPair(ctx, minRatio, entry.c1, entry.c2);
      Cf = pair.big; Cg = pair.small;
    }
    // Tiny tolerance so a ratio exactly at the bound isn't refused by float noise.
    if (Cf / Cg < minRatio * (1 - 1e-12)) {
      return { error: `C1/C2 must be ≥ ${minRatio.toFixed(2)} for Q = ${Q.toFixed(2)} at gain ${K}` };
    }

    const a = 1 / (w0 * w0);
    const b = 1 / (Q * w0);
    const A = Cg + Cf * (1 - K);
    const C = a / Cf;
    let roots;
    if (Math.abs(A) < 1e-30) {
      roots = [C / b];                                    // linear: −b·R1 + C = 0
    } else {
      const s = Math.sqrt(Math.max(0, b * b - 4 * A * C));
      roots = [(b - s) / (2 * A), (b + s) / (2 * A)];
    }
    const positive = roots.filter(x => x > 0).sort((x, y) => x - y);
    if (positive.length === 0) {
      return { error: `C1/C2 must be ≥ ${minRatio.toFixed(2)} for Q = ${Q.toFixed(2)} at gain ${K}` };
    }
    // One positive root (large K): that's it. Two (e.g. unity gain): FilterPro's
    // pick is unknown (spec check 5), so take the one with R1 ≤ R2.
    const r2For = r1 => a / (r1 * Cf * Cg);
    let R1exact = positive.find(r1 => r1 <= r2For(r1));
    if (R1exact === undefined) R1exact = positive[0];

    const R1 = ctx.roundR(R1exact);
    const R2 = ctx.roundR(a / (R1 * Cf * Cg));          // from the rounded R1
    const R3 = ctx.roundR(ctx.seed);
    const parts = { R1, R2, R3, C1: Cf, C2: Cg };
    let gainActual = 1;
    if (K > 1) {
      parts.R4 = ctx.roundR((K - 1) * R3);
      gainActual = 1 + parts.R4 / R3;
    }
    return { parts, gainActual };
  }

  // ---- Default equal caps (HP, BP, notch) -----------------------------------
  // These circuits use two equal caps by default. A cap the user typed is kept;
  // an empty one takes the other's typed value, else round(base) (base capped
  // at 1uF so very low fn still has a default; the resistors scale up).
  function equalCaps(ctx, base) {
    const { entry } = ctx;
    const shared = entry.c1 != null ? entry.c1 : entry.c2 != null ? entry.c2 : ctx.roundC(Math.min(base, MAX_CAP));
    return {
      C1: entry.c1 != null ? entry.c1 : shared,
      C2: entry.c2 != null ? entry.c2 : shared,
    };
  }

  // ---- MFB high-pass ----------------------------------------------------------
  // C1 from the input to node X, R1 from X to ground, C3 from X to the output
  // (gain-setting feedback), C2 from X to the inverting input, R2 from the
  // inverting input to the output. + input grounded. (The low-pass with every
  // R and C swapped.) With the inverting input at virtual ground:
  //   H(s) = −(C1/C3) · s² / (s² + s·(C1+C2+C3)/(R2·C2·C3) + 1/(R1·R2·C2·C3))
  // so
  //   gain G = C1/C3 (inverting, at high frequency)
  //   ω0²    = 1/(R1·R2·C2·C3)
  //   ω0/Q   = (C1+C2+C3)/(R2·C2·C3)   →   R2 = Q·(C1+C2+C3)/(ω0·C2·C3)
  // Any Q is realizable: no cap ratio constraint.
  // Default caps: C1 = C2 = round(C0), C3 = round(C1/G). R2 (sets Q) is
  // rounded first; R1 (sets fn) is recomputed from the rounded R2.
  function solveMfbHighPass(ctx) {
    const { st, entry, w0 } = ctx;
    const Q = st.q, G = st.gain;
    if (!(G > 0)) return { error: `Gain must be > 0 (got ${G})` };
    const { C1, C2 } = equalCaps(ctx, ctx.c0);
    const C3 = entry.c3 != null ? entry.c3 : ctx.roundC(C1 / G);
    const R2 = ctx.roundR(Q * (C1 + C2 + C3) / (w0 * C2 * C3));
    const R1 = ctx.roundR(1 / (w0 * w0 * R2 * C2 * C3));
    return { parts: { R1, R2, C1, C2, C3 }, gainActual: C1 / C3 };
  }

  // ---- Sallen-Key high-pass ---------------------------------------------------
  // C1 from the input to node X, C2 from X to the + input, R1 from X to the
  // output (feedback), R2 from the + input to ground. Non-inverting gain
  // K = 1 + R4/R3, R3 (to ground) = the seed, as in the low-pass.
  //   H(s) = K·s² / (s² + s·[(C1+C2)/(R2·C1·C2) + (1−K)/(R1·C1)] + 1/(R1·R2·C1·C2))
  // Multiplying the denominator through by a = 1/ω0²:
  //   a = R1·R2·C1·C2                 = 1/ω0²
  //   b = R1·(C1+C2) + R2·C2·(1−K)    = 1/(Q·ω0)
  // Substituting R2 = a/(R1·C1·C2) into b gives a quadratic in R1:
  //   (C1+C2)·R1² − b·R1 + a·(1−K)/C1 = 0
  // For K ≥ 1 the constant term is ≤ 0, so there is always exactly one
  // positive root (K = 1: R1 = b/(C1+C2); equal caps give R1 = 1/(2Q·ω0·C),
  // R2 = 2Q/(ω0·C)). No cap ratio constraint.
  // Default caps C1 = C2 = round(C0). R1 (from the Q quadratic) is rounded
  // first and R2 recomputed from it so fn holds, as in the SK low-pass.
  function solveSkHighPass(ctx) {
    const { st, w0 } = ctx;
    const Q = st.q, K = st.gain;
    if (!(K >= 1)) {
      return { error: `Sallen-Key gain must be ≥ 1 (got ${K})` };
    }
    const { C1, C2 } = equalCaps(ctx, ctx.c0);
    const a = 1 / (w0 * w0);
    const b = 1 / (Q * w0);
    const A = C1 + C2;
    const C = a * (1 - K) / C1;                             // ≤ 0 for K ≥ 1
    const R1exact = (b + Math.sqrt(b * b - 4 * A * C)) / (2 * A);
    const R1 = ctx.roundR(R1exact);
    const R2 = ctx.roundR(a / (R1 * C1 * C2));              // from the rounded R1
    const R3 = ctx.roundR(ctx.seed);
    const parts = { R1, R2, R3, C1, C2 };
    let gainActual = 1;
    if (K > 1) {
      parts.R4 = ctx.roundR((K - 1) * R3);
      gainActual = 1 + parts.R4 / R3;
    }
    return { parts, gainActual };
  }

  // FilterPro's default band-pass cap is about 1.7·C0 (27n at a 10k seed and
  // 1 kHz, where C0 = 15.9n). Kept in one place; provisional (spec check 3).
  const BP_CAP_FACTOR = 1.7;

  // ---- MFB band-pass section (shared by band-pass and notch) -----------------
  // R1 from the input to node X, R3 from X to ground, C1 from X to the output
  // (feedback), C2 from X to the inverting input, R2 from the inverting input
  // to the output (feedback). + input grounded.
  //   H(s) = −(s/(R1·C1)) / (s² + s·(C1+C2)/(R2·C1·C2) + (1/R1 + 1/R3)/(R2·C1·C2))
  // so
  //   ω0/Q = (C1+C2)/(R2·C1·C2)            →  R2 = Q·(C1+C2)/(ω0·C1·C2)
  //   centre gain G = R2·C2/(R1·(C1+C2))   →  R1 = R2·C2/(G·(C1+C2))
  //                 (equal caps: G = R2/(2·R1))
  //   ω0²  = (1/R1 + 1/R3)/(R2·C1·C2)      →  1/R3 = ω0²·R2·C1·C2 − 1/R1
  // R3 > 0 needs ω0²·R2·C1·C2·R1 > 1, which works out to
  //   G < Q²·(C1+C2)/C1                     (equal caps: G < 2·Q²)
  // R2 (sets Q) is rounded first; R1 (gain) and then R3 (fn) are recomputed
  // from the rounded values. The centre gain doesn't depend on R3.
  // Returns { parts, gainActual } or { error, bound } (bound = max gain).
  function mfbBandPassSection(ctx, G) {
    const { st, w0 } = ctx;
    const Q = st.q;
    const { C1, C2 } = equalCaps(ctx, ctx.c0 * BP_CAP_FACTOR);
    const bound = Q * Q * (C1 + C2) / C1;
    const refuse = { error: `Band-pass gain must be < ${bound.toFixed(2)} for Q = ${Q.toFixed(2)}`, bound };
    if (!(G > 0) || !(G < bound)) return refuse;
    const R2 = ctx.roundR(Q * (C1 + C2) / (w0 * C1 * C2));
    const R1 = ctx.roundR(R2 * C2 / (G * (C1 + C2)));
    const g3 = w0 * w0 * R2 * C1 * C2 - 1 / R1;             // 1/R3
    if (!(g3 > 0)) return refuse;                            // rounding pushed past the bound
    const R3 = ctx.roundR(1 / g3);
    return { parts: { R1, R2, R3, C1, C2 }, gainActual: R2 * C2 / (R1 * (C1 + C2)) };
  }

  // ---- MFB band-pass (inverting; gain is the centre-frequency gain) ----------
  function solveMfbBandPass(ctx) {
    return mfbBandPassSection(ctx, ctx.st.gain);
  }

  // ---- Notch -------------------------------------------------------------------
  // One fixed topology: the MFB band-pass section above at centre gain 1, then
  // an inverting summer that adds the input and the band-pass output:
  //   R4 from the input to the summer's inverting input (node S),
  //   R5 from the band-pass output to S, R6 from S to the output.
  //   v_out = −R6·(v_in/R4 + v_bp/R5)
  // The band-pass is v_bp = −v_in·(s·ω0/Q)/D(s), D = s² + s·ω0/Q + ω0², so
  // with R4 = R5:
  //   H(s) = −(R6/R4)·(D(s) − s·ω0/Q)/D(s) = −(R6/R4)·(s² + ω0²)/D(s)
  // The notch depth depends on R4 = R5 and the band-pass gain being exactly 1.
  // R4 = R5 = round(seed); R6 = round(G·seed) sets the passband gain (G = 1:
  // all three equal). Provisional until spec check 4.
  // Band-pass gain 1 needs 1 < Q²·(C1+C2)/C1, i.e. Q > 1/√2 for equal caps.
  function solveNotch(ctx) {
    const { st } = ctx;
    const G = st.gain;
    if (!(G > 0)) return { error: `Gain must be > 0 (got ${G})` };
    const sec = mfbBandPassSection(ctx, 1);
    if (sec.error) {
      const { C1, C2 } = equalCaps(ctx, ctx.c0 * BP_CAP_FACTOR);
      const qMin = Math.sqrt(C1 / (C1 + C2));
      return { error: `Notch Q must be > ${qMin.toFixed(2)} (got ${st.q.toFixed(2)})` };
    }
    const R4 = ctx.roundR(ctx.seed);
    const parts = Object.assign(sec.parts, { R4, R5: R4, R6: ctx.roundR(G * ctx.seed) });
    return { parts, gainActual: parts.R6 / R4 };
  }

  window.FH.solve = { stage, skMinRatio };
})();
</script>
<script data-module="response">
(function () {
  // ---- Complex arithmetic ---------------------------------------------------
  // Plain {re, im} objects. Only what nodal analysis needs.
  const cx = (re, im = 0) => ({ re, im });
  const add = (a, b) => cx(a.re + b.re, a.im + b.im);
  const sub = (a, b) => cx(a.re - b.re, a.im - b.im);
  const mul = (a, b) => cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const div = (a, b) => {
    const d = b.re * b.re + b.im * b.im;
    return cx((a.re * b.re + a.im * b.im) / d, (a.im * b.re - a.re * b.im) / d);
  };
  const mag = a => Math.hypot(a.re, a.im);
  const argDeg = a => Math.atan2(a.im, a.re) * 180 / Math.PI;

  // ---- Netlists ---------------------------------------------------------------
  // One row per (role, kind/circuit). Each takes a stage's parts and returns
  //   elements: [type, nodeA, nodeB, value], type 'R' (ohms) or 'C' (farads)
  //   opamp:    { plus, minus, out }: a voltage source out = A·(v+ − v−)
  //             (or opamps: [ ... ] for a two-op-amp stage; the notch)
  //   inverting: true when the passband gain is negative (MFB, notch)
  // Nodes: 'in' is driven with 1 V, 'gnd' is 0 V, everything else is solved
  // for; the stage output is always 'out'. Shared names: in, n1, n2, out
  // (n3 for the SK gain divider and the notch summer, bp for the notch's
  // band-pass output).
  // Part names follow the global convention: LP C1 = feedback, C2 = to ground;
  // MFB HP C1 = input, C2 = series to the − input, C3 = feedback; SK HP
  // C1 = input, C2 = second series cap.
  const NETLISTS = {
    // Real pole: R1 into n1, C1 from n1 to ground, unity buffer (− tied to out).
    'lp/real': p => ({
      elements: [['R', 'in', 'n1', p.R1], ['C', 'n1', 'gnd', p.C1]],
      opamp: { plus: 'n1', minus: 'out', out: 'out' },
      inverting: false,
    }),
    // MFB low-pass: R1 in→n1, R2 n1→out, R3 n1→n2 (inverting input),
    // C1 n2→out (feedback), C2 n1→ground. + input grounded. Gain −R2/R1.
    'lp/mfb': p => ({
      elements: [
        ['R', 'in', 'n1', p.R1], ['R', 'n1', 'out', p.R2], ['R', 'n1', 'n2', p.R3],
        ['C', 'n2', 'out', p.C1], ['C', 'n1', 'gnd', p.C2],
      ],
      opamp: { plus: 'gnd', minus: 'n2', out: 'out' },
      inverting: true,
    }),
    // Sallen-Key low-pass: R1 in→n1, R2 n1→n2 (+ input), C1 n1→out (feedback),
    // C2 n2→ground. With R4: − input at n3 = out·R3/(R3+R4) (R4 out→n3,
    // R3 n3→ground), gain 1 + R4/R3. Without R4: unity buffer.
    'lp/sk': p => {
      const elements = [
        ['R', 'in', 'n1', p.R1], ['R', 'n1', 'n2', p.R2],
        ['C', 'n1', 'out', p.C1], ['C', 'n2', 'gnd', p.C2],
      ];
      let minus = 'out';
      if (p.R4 != null) {
        elements.push(['R', 'out', 'n3', p.R4], ['R', 'n3', 'gnd', p.R3]);
        minus = 'n3';
      }
      return { elements, opamp: { plus: 'n2', minus, out: 'out' }, inverting: false };
    },
    // Real-pole high-pass: C1 into n1, R1 from n1 to ground, unity buffer.
    'hp/real': p => ({
      elements: [['C', 'in', 'n1', p.C1], ['R', 'n1', 'gnd', p.R1]],
      opamp: { plus: 'n1', minus: 'out', out: 'out' },
      inverting: false,
    }),
    // MFB high-pass: C1 in→n1, R1 n1→ground, C3 n1→out (feedback),
    // C2 n1→n2 (inverting input), R2 n2→out. + input grounded. Gain −C1/C3.
    'hp/mfb': p => ({
      elements: [
        ['C', 'in', 'n1', p.C1], ['R', 'n1', 'gnd', p.R1], ['C', 'n1', 'out', p.C3],
        ['C', 'n1', 'n2', p.C2], ['R', 'n2', 'out', p.R2],
      ],
      opamp: { plus: 'gnd', minus: 'n2', out: 'out' },
      inverting: true,
    }),
    // Sallen-Key high-pass: C1 in→n1, C2 n1→n2 (+ input), R1 n1→out
    // (feedback), R2 n2→ground. Gain divider R4/R3 as in 'lp/sk'.
    'hp/sk': p => {
      const elements = [
        ['C', 'in', 'n1', p.C1], ['C', 'n1', 'n2', p.C2],
        ['R', 'n1', 'out', p.R1], ['R', 'n2', 'gnd', p.R2],
      ];
      let minus = 'out';
      if (p.R4 != null) {
        elements.push(['R', 'out', 'n3', p.R4], ['R', 'n3', 'gnd', p.R3]);
        minus = 'n3';
      }
      return { elements, opamp: { plus: 'n2', minus, out: 'out' }, inverting: false };
    },
    // MFB band-pass: R1 in→n1, R3 n1→ground, C1 n1→out (feedback),
    // C2 n1→n2 (inverting input), R2 n2→out. + input grounded.
    // Centre gain −R2·C2/(R1·(C1+C2)) (equal caps: −R2/(2·R1)).
    'bp/mfb': p => ({
      elements: [
        ['R', 'in', 'n1', p.R1], ['R', 'n1', 'gnd', p.R3], ['C', 'n1', 'out', p.C1],
        ['C', 'n1', 'n2', p.C2], ['R', 'n2', 'out', p.R2],
      ],
      opamp: { plus: 'gnd', minus: 'n2', out: 'out' },
      inverting: true,
    }),
    // Notch: the MFB band-pass above with its output at 'bp', then an
    // inverting summer: R4 in→n3, R5 bp→n3, R6 n3→out, + input grounded.
    // Passband gain −R6/R4.
    notch: p => ({
      elements: [
        ['R', 'in', 'n1', p.R1], ['R', 'n1', 'gnd', p.R3], ['C', 'n1', 'bp', p.C1],
        ['C', 'n1', 'n2', p.C2], ['R', 'n2', 'bp', p.R2],
        ['R', 'in', 'n3', p.R4], ['R', 'bp', 'n3', p.R5], ['R', 'n3', 'out', p.R6],
      ],
      opamps: [
        { plus: 'gnd', minus: 'n2', out: 'bp' },
        { plus: 'gnd', minus: 'n3', out: 'out' },
      ],
      inverting: true,
    }),
  };

  function netlistFor(solved) {
    const st = solved.stage;
    // The notch has one fixed topology, whatever circuit is selected.
    const key = st.role === 'notch' ? 'notch' : `${st.role}/${st.kind === 'real' ? 'real' : solved.circuit}`;
    const make = NETLISTS[key];
    if (!make) throw new Error(`No netlist for ${key}`);
    return make(solved.parts);
  }

  // Op amp open-loop gain at f. A single-pole op amp has A(jω) ≈ ωT/(jω),
  // i.e. 2π·gbw/(j·2πf) = −j·gbw/f. No gbw = "ideal": a very large real gain.
  function opampGain(f, gbw) {
    return gbw ? cx(0, -gbw / f) : cx(1e9);
  }

  // Solve M·x = b in place by Gaussian elimination with partial pivoting.
  // At most 4 unknowns here, so no cleverness needed.
  function solveLinear(M, b) {
    const n = b.length;
    for (let col = 0; col < n; col++) {
      let pivot = col;
      for (let r = col + 1; r < n; r++) if (mag(M[r][col]) > mag(M[pivot][col])) pivot = r;
      [M[col], M[pivot]] = [M[pivot], M[col]];
      [b[col], b[pivot]] = [b[pivot], b[col]];
      for (let r = col + 1; r < n; r++) {
        const k = div(M[r][col], M[col][col]);
        for (let c = col; c < n; c++) M[r][c] = sub(M[r][c], mul(k, M[col][c]));
        b[r] = sub(b[r], mul(k, b[col]));
      }
    }
    const x = new Array(n);
    for (let r = n - 1; r >= 0; r--) {
      let s = b[r];
      for (let c = r + 1; c < n; c++) s = sub(s, mul(M[r][c], x[c]));
      x[r] = div(s, M[r][r]);
    }
    return x;
  }

  // H(j2πf) = v(out)/v(in) for one solved stage, by nodal analysis.
  //   Every unknown node except an op amp output gets a KCL row:
  //     Σ y·(v_node − v_other) = 0, with y = 1/R or jωC.
  //   An op amp output node's KCL would need the op amp's output current,
  //   which is unknown, so that row is replaced by the op amp equation:
  //     v_out − A·v+ + A·v− = 0
  //   v(in) = 1 moves to the right-hand side; ground drops out.
  //   The stage output is node 'out'.
  function stageH(solved, f, gbw) {
    const net = netlistFor(solved);
    const amps = net.opamps || [net.opamp];
    const w = 2 * Math.PI * f;
    const nodes = [];
    const ends = net.elements.map(([, a, b]) => [a, b]);
    for (const amp of amps) ends.push([amp.out, amp.plus, amp.minus]);
    for (const group of ends) {
      for (const n of group) if (n !== 'in' && n !== 'gnd' && !nodes.includes(n)) nodes.push(n);
    }
    const idx = {};
    nodes.forEach((n, i) => { idx[n] = i; });
    const N = nodes.length;
    const M = nodes.map(() => nodes.map(() => cx(0)));
    const rhs = nodes.map(() => cx(0));

    // Stamp each two-terminal element into the KCL rows of its ends.
    for (const [type, a, b, value] of net.elements) {
      const y = type === 'R' ? cx(1 / value) : cx(0, w * value);
      for (const [here, there] of [[a, b], [b, a]]) {
        if (!(here in idx)) continue;
        const r = idx[here];
        M[r][r] = add(M[r][r], y);
        if (there in idx) M[r][idx[there]] = sub(M[r][idx[there]], y);
        else if (there === 'in') rhs[r] = add(rhs[r], y); // y·v(in), v(in) = 1
      }
    }

    // Each op amp's row replaces its output node's KCL.
    const A = opampGain(f, gbw);
    for (const { plus, minus, out } of amps) {
      const o = idx[out];
      for (let c = 0; c < N; c++) M[o][c] = cx(0);
      rhs[o] = cx(0);
      M[o][o] = cx(1);
      if (plus in idx) M[o][idx[plus]] = sub(M[o][idx[plus]], A);
      if (minus in idx) M[o][idx[minus]] = add(M[o][idx[minus]], A);
    }

    return solveLinear(M, rhs)[idx.out];
  }

  // Product of the stages' responses (they are buffered, so they multiply).
  function cascadeH(list, f, gbw) {
    return list.reduce((h, s) => mul(h, stageH(s, f, gbw)), cx(1));
  }

  // One stage's phase in degrees, in FilterPro's table convention: the
  // inversion (180°) of MFB stages and the notch is not included, so an MFB
  // low-pass reads like any other low-pass (e.g. −169.4°, not +10.6°), and an
  // MFB high-pass / band-pass reads +90° / 0° at fn. Principal value, (−180°, 180°].
  function stagePhaseDeg(solved, f, gbw) {
    let h = stageH(solved, f, gbw);
    if (netlistFor(solved).inverting) h = cx(-h.re, -h.im);
    return argDeg(h);
  }

  // Gain, phase and group delay of a cascade at one frequency.
  //   db:    20·log10|H|
  //   deg:   sum of the stage phases (so a 4-pole reads −345°, not +15°).
  //          A sweep unwraps this further across frequency.
  //   gdSec: −dφ/dω, central difference at f·(1 ± 0.001). The phase step is
  //          taken as arg(H₊/H₋), which is already in (−π, π].
  function point(list, f, gbw) {
    const h = cascadeH(list, f, gbw);
    const deg = list.reduce((sum, s) => sum + stagePhaseDeg(s, f, gbw), 0);
    const fHi = f * 1.001, fLo = f * 0.999;
    const hHi = cascadeH(list, fHi, gbw), hLo = cascadeH(list, fLo, gbw);
    const ratio = div(hHi, hLo);
    const dPhi = Math.atan2(ratio.im, ratio.re);
    const gdSec = -dPhi / (2 * Math.PI * (fHi - fLo));
    return { db: 20 * Math.log10(mag(h)), deg, gdSec };
  }

  // n log-spaced points from fStart to fStop, phase unwrapped (no jumps of
  // more than 180° between neighbouring points).
  function sweep(list, fStart, fStop, n = 400, gbw = null) {
    const out = [];
    let prev = null;
    for (let i = 0; i < n; i++) {
      const f = fStart * Math.pow(fStop / fStart, n > 1 ? i / (n - 1) : 0);
      const p = point(list, f, gbw);
      let deg = p.deg;
      if (prev !== null) {
        while (deg - prev > 180) deg -= 360;
        while (deg - prev < -180) deg += 360;
      }
      prev = deg;
      out.push({ f, db: p.db, deg, gdSec: p.gdSec });
    }
    return out;
  }

  // Rule-of-thumb op amp gain-bandwidth for a stage (FilterPro's Req. GBP):
  //   real pole: 50·fn
  //   MFB pair:  100·Q·fn·G
  //   SK pair:   206·G·Q^1.5·fn
  // G is the gain the rounded parts actually give (e.g. 1.996, 10.09).
  // Band-pass and notch: no rule, null.
  function requiredGBP(solved) {
    const st = solved.stage;
    if (st.role === 'bp' || st.role === 'notch') return null;
    if (st.kind === 'real') return 50 * st.fn;
    const G = solved.gainActual;
    if (solved.circuit === 'mfb') return 100 * st.q * st.fn * G;
    if (solved.circuit === 'sk') return 206 * G * Math.pow(st.q, 1.5) * st.fn;
    return null;
  }

  window.FH.response = { stageH, cascadeH, point, sweep, requiredGBP, NETLISTS };
})();
</script>
<script data-module="state">
(function () {
  const STORAGE_KEY = 'fh.last';
  const PASSBANDS = ['lp', 'hp', 'bp', 'notch'];
  const CIRCUITS = ['mfb', 'sk'];
  const RESPONSES = ['butterworth', 'bessel', 'chebyshev'];
  const RES_SERIES = ['Exact', 'E12', 'E24', 'E96'];
  const CAP_SERIES = ['E6', 'E12', 'E24'];
  const PART_KEYS = ['c1', 'c2', 'c3', 'gain'];

  function defaults() {
    return {
      passband: 'lp', circuit: 'mfb', response: 'chebyshev', poles: 4, fc: 1000, rippleDb: 1, bpQ: 10,
      resSeries: 'E96', capSeries: 'E12', seed: 10000, cursor: 10000, entries: {}, gbw: null, showReal: false,
    };
  }

  const isPosNum = v => typeof v === 'number' && isFinite(v) && v > 0;
  const pickEnum = (v, allowed, dflt) => (allowed.indexOf(v) >= 0 ? v : dflt);
  const pickPos = (v, dflt) => (isPosNum(v) ? v : dflt);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  // Finite number clamped to [lo, hi], else the default.
  const pickClamped = (v, lo, hi, dflt) => (typeof v === 'number' && isFinite(v) ? clamp(v, lo, hi) : dflt);

  // Make any input (hash, storage JSON, half-edited UI state) into a valid State,
  // falling back field by field to the defaults.
  function normalize(input) {
    const d = defaults();
    const s = input && typeof input === 'object' && !Array.isArray(input) ? input : {};
    const out = {
      passband: pickEnum(s.passband, PASSBANDS, d.passband),
      circuit: pickEnum(s.circuit, CIRCUITS, d.circuit),
      response: pickEnum(s.response, RESPONSES, d.response),
      fc: pickPos(s.fc, d.fc),
      rippleDb: pickClamped(s.rippleDb, 0.01, 3, d.rippleDb), // 0 dB makes Chebyshev poles NaN
      bpQ: pickClamped(s.bpQ, 0.5, 100, d.bpQ),
      resSeries: pickEnum(s.resSeries, RES_SERIES, d.resSeries),
      capSeries: pickEnum(s.capSeries, CAP_SERIES, d.capSeries),
      seed: pickPos(s.seed, d.seed),
      cursor: pickPos(s.cursor, d.cursor),
      gbw: pickPos(s.gbw, null),
      showReal: s.showReal === true,
      entries: {},
    };
    const maxPoles = out.passband === 'bp' ? 5 : 10;
    out.poles = Math.round(pickClamped(s.poles, 1, maxPoles, d.poles));
    if (out.passband === 'bp') out.circuit = 'mfb';

    // Keep typed parts only for rows that exist now, and only valid numbers.
    const rows = {};
    window.FH.stages.build(out).forEach(st => { rows[st.label] = true; });
    const src = s.entries && typeof s.entries === 'object' && !Array.isArray(s.entries) ? s.entries : {};
    Object.keys(src).forEach(label => {
      const e = src[label];
      if (!rows[label] || !e || typeof e !== 'object') return;
      const kept = {};
      PART_KEYS.forEach(k => { if (isPosNum(e[k])) kept[k] = e[k]; });
      if (Object.keys(kept).length) out.entries[label] = kept;
    });
    return out;
  }

  // Compact "key=value&..." with entries as "A.c1=4.7e-9". The default-valued
  // fields are written too, so a link keeps meaning if defaults change later.
  function encodeHash(input) {
    const s = normalize(input);
    const parts = [];
    ['passband', 'circuit', 'response', 'poles', 'fc', 'rippleDb', 'bpQ', 'resSeries', 'capSeries', 'seed', 'cursor']
      .forEach(k => parts.push(k + '=' + s[k]));
    if (s.gbw !== null) parts.push('gbw=' + s.gbw);
    if (s.showReal) parts.push('showReal=1');
    Object.keys(s.entries).sort().forEach(label => {
      PART_KEYS.forEach(k => { if (k in s.entries[label]) parts.push(label + '.' + k + '=' + s.entries[label][k]); });
    });
    return parts.join('&');
  }

  function decodeHash(hash) {
    const raw = {};
    const entries = {};
    String(hash || '').replace(/^#/, '').split('&').forEach(pair => {
      const i = pair.indexOf('=');
      if (i <= 0) return;
      let key = pair.slice(0, i);
      let val = pair.slice(i + 1);
      try { key = decodeURIComponent(key); val = decodeURIComponent(val); } catch (e) { return; }
      const dot = key.indexOf('.');
      if (dot > 0) {
        const label = key.slice(0, dot), part = key.slice(dot + 1);
        if (PART_KEYS.indexOf(part) < 0) return;
        const n = val.trim() === '' ? NaN : Number(val);
        if (!isNaN(n)) (entries[label] = entries[label] || {})[part] = n;
        return;
      }
      raw[key] = val;
    });
    const num = k => (raw[k] === undefined || raw[k].trim() === '' ? undefined : Number(raw[k]));
    return normalize({
      passband: raw.passband, circuit: raw.circuit, response: raw.response, resSeries: raw.resSeries, capSeries: raw.capSeries,
      poles: num('poles'), fc: num('fc'), rippleDb: num('rippleDb'), bpQ: num('bpQ'),
      seed: num('seed'), cursor: num('cursor'), gbw: num('gbw'),
      showReal: raw.showReal === '1' || raw.showReal === 'true',
      entries,
    });
  }

  // Precedence: URL hash > localStorage 'fh.last' > defaults. Blocked or broken
  // storage is ignored.
  function initial(hash, storage) {
    if (String(hash || '').replace(/^#/, '') !== '') return decodeHash(hash);
    try {
      const saved = storage && storage.getItem(STORAGE_KEY);
      if (saved) return normalize(JSON.parse(saved));
    } catch (e) { /* fall through to defaults */ }
    return defaults();
  }

  window.FH.state = { defaults, normalize, encodeHash, decodeHash, initial, STORAGE_KEY };
})();
</script>
